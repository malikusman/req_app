services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: req_app
      POSTGRES_PASSWORD: req_app
      POSTGRES_DB: req_app_development
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U req_app -d req_app_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit
    ports:
      # Host ports are overridable so the stack can run alongside another
      # project's mail catcher (see .env). Defaults are unchanged.
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3001:3000"

  langgraph:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./agent/app:/app/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_JSON_MODE: ${OPENAI_JSON_MODE:-true}
      # Cap on generated tokens. Every agent prompt asks for a compact JSON object,
      # so an uncapped generation only lets a local model ramble. MEASURED on
      # Gemma 12B: a realistic discovery turn went 570s uncapped -> 81s at 1200.
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-3000}
      # Only sent when set. Required for local reasoning models, rejected by
      # non-reasoning ones — hence empty by default.
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      DOCS_MODEL_FAST: ${DOCS_MODEL_FAST:-gpt-4.1-mini}
      DOCS_MODEL_REASONING: ${DOCS_MODEL_REASONING:-o4-mini}
      RAILS_INTERNAL_URL: http://rails:3000
      INTERNAL_API_TOKEN: dev-internal-token
      REDIS_URL: redis://redis:6379/0
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-worktruth-agent}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-}
    depends_on:
      - redis

  rails:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: bash -c "bundle install && rm -f tmp/pids/server.pid && bundle exec rails db:prepare && bundle exec rails server -b 0.0.0.0"
    volumes:
      - ./backend:/app
      - ./docs/manual-test:/docs/manual-test
    ports:
      # Overridable so the stack can run alongside another project holding 3000
      # (see .env). Default unchanged. Keep in step with API_PUBLIC_HOST below.
      - "${RAILS_HOST_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://req_app:req_app@postgres:5432/req_app_development
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-jwt-secret-change-in-production
      APP_HOST: http://localhost:5173
      FROM_EMAIL: notifications@reqapp.local
      SMTP_ADDRESS: mailpit
      SMTP_PORT: 1025
      META_VERIFY_TOKEN: req_app_verify_token
      LANGGRAPH_URL: http://langgraph:8000
      LANGGRAPH_DOCS_READ_TIMEOUT: ${LANGGRAPH_DOCS_READ_TIMEOUT:-180}
      LANGGRAPH_READ_TIMEOUT: ${LANGGRAPH_READ_TIMEOUT:-45}
      INTERNAL_API_TOKEN: dev-internal-token
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: req-app
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4.1-mini}
      DOCS_MODEL_FAST: ${DOCS_MODEL_FAST:-gpt-4.1-mini}
      DOCS_MODEL_REASONING: ${DOCS_MODEL_REASONING:-o4-mini}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
      AI_CATALOG_SYNC_INTERVAL_HOURS: ${AI_CATALOG_SYNC_INTERVAL_HOURS:-12}
      AI_CATALOG_MAX_CANDIDATES_PER_RUN: ${AI_CATALOG_MAX_CANDIDATES_PER_RUN:-25}
      AI_MARKET_ALERT_MAX_PER_MONTH: ${AI_MARKET_ALERT_MAX_PER_MONTH:-2}
      AI_MARKET_ALERT_MIN_SCORE: ${AI_MARKET_ALERT_MIN_SCORE:-0.8}
      AI_MARKET_NEWS_MAX_AGE_DAYS: ${AI_MARKET_NEWS_MAX_AGE_DAYS:-14}
      GOTENBERG_URL: http://gotenberg:3000
      API_PUBLIC_HOST: http://localhost:${RAILS_HOST_PORT:-3000}
      RAILS_ENV: development
    depends_on:
      gotenberg:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  sidekiq:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: bash -c "bundle install && bundle exec sidekiq"
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://req_app:req_app@postgres:5432/req_app_development
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-jwt-secret-change-in-production
      LANGGRAPH_URL: http://langgraph:8000
      LANGGRAPH_DOCS_READ_TIMEOUT: ${LANGGRAPH_DOCS_READ_TIMEOUT:-180}
      LANGGRAPH_READ_TIMEOUT: ${LANGGRAPH_READ_TIMEOUT:-45}
      INTERNAL_API_TOKEN: dev-internal-token
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: req-app
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4.1-mini}
      DOCS_MODEL_FAST: ${DOCS_MODEL_FAST:-gpt-4.1-mini}
      DOCS_MODEL_REASONING: ${DOCS_MODEL_REASONING:-o4-mini}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
      AI_CATALOG_SYNC_INTERVAL_HOURS: ${AI_CATALOG_SYNC_INTERVAL_HOURS:-12}
      AI_CATALOG_MAX_CANDIDATES_PER_RUN: ${AI_CATALOG_MAX_CANDIDATES_PER_RUN:-25}
      AI_MARKET_ALERT_MAX_PER_MONTH: ${AI_MARKET_ALERT_MAX_PER_MONTH:-2}
      AI_MARKET_ALERT_MIN_SCORE: ${AI_MARKET_ALERT_MIN_SCORE:-0.8}
      AI_MARKET_NEWS_MAX_AGE_DAYS: ${AI_MARKET_NEWS_MAX_AGE_DAYS:-14}
      GOTENBERG_URL: http://gotenberg:3000
    depends_on:
      - postgres
      - redis
      - mailpit
      - minio
      - gotenberg
      - rails
      - langgraph

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ""
      VITE_PROXY_TARGET: http://rails:3000
    depends_on:
      - rails

volumes:
  pg_data:
  redis_data:
  minio_data:
  frontend_node_modules:
