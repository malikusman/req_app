default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV.fetch("DATABASE_URL", "postgres://req_app:req_app@localhost:5432/req_app_development") %>

development:
  <<: *default

# Force the test database name even when DATABASE_URL points elsewhere
# (e.g. docker-compose sets it to req_app_development) so local spec runs
# can never touch the development database.
test:
  <<: *default
  url: <%= (ENV["TEST_DATABASE_URL"] || ENV.fetch("DATABASE_URL", "postgres://req_app:req_app@localhost:5432/req_app_test")).sub(%r{/[^/?]+(\?.*)?\z}, '/req_app_test\1') %>

production:
  <<: *default
